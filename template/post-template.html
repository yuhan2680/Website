</head><body data-post-id="{{slug}}">
<a class="skip-link" href="#main">跳到正文</a><canvas id="star-canvas" aria-hidden="true"></canvas>
<header class="site-header"><nav class="menu-container" aria-label="主导航"><a class="brand" href="/" aria-label="小涵 Naiwenel 首页"><span class="brand-mark" aria-hidden="true">✳</span><span>小涵<span class="brand-en">NAIWENEL</span></span></a><div class="menu-function"><button class="icon-button hamburger" id="hamburger" type="button" aria-label="展开导航菜单" aria-expanded="false" aria-controls="menuList">☰</button><ul class="menu-list" id="menuList"><li><a class="menu-item" href="/">首页</a></li><li><a class="menu-item active" href="/blog" aria-current="page">手记</a></li><li><a class="menu-item" href="/about">关于</a></li><li><a class="menu-item" href="/friendlinks">友邻</a></li><li><a class="menu-item" href="/donate">支持</a></li></ul><span class="nav-divider" aria-hidden="true"></span><button class="icon-button" id="nightToggle" type="button" aria-label="切换到深色模式" aria-pressed="false">☾</button><a class="rss-link" href="/rss.xml" aria-label="订阅 RSS">RSS ↗</a></div></nav></header>
<main id="main" tabindex="-1" class="site-main"><div class="reading-layout"><a href="/blog">← 返回全部手记</a><article class="article-container panel"><header class="article-header"><p class="post-meta"><time datetime="{{date}}">{{date}}</time></p><h1>{{title}}</h1></header><div class="article-content">{{content}}</div></article><section class="comment-container panel" id="comments" aria-labelledby="commentsTitle">
  <div class="section-heading"><div><p class="eyebrow">LEAVE A LITTLE STARDUST</p><h2 id="commentsTitle">文章留言</h2></div><span class="section-symbol" aria-hidden="true">✧</span></div>
  <p class="muted">路过也好，常驻也好，留下一点你的声音吧。</p>
  <form id="commentForm" class="comment-form">
    <div><label for="nickname">昵称 <span class="muted">（最多 20 字）</span></label><input id="nickname" name="nickname" maxlength="20" required autocomplete="nickname" placeholder="怎么称呼你？"></div>
    <div><label for="comment">留言 <span class="muted">（最多 500 字）</span></label><textarea id="comment" name="content" maxlength="500" required rows="4" placeholder="写下你想说的话…"></textarea></div>
    <div hidden><label for="website">请留空</label><input id="website" name="website" autocomplete="off" tabindex="-1"></div>
    <div class="form-actions"><span class="muted small">留言会公开显示，请勿填写私人信息。</span><button id="sendComment" class="button primary" type="submit">提交评论</button></div>
  </form>
  <p id="commentStatus" class="status" role="status" aria-live="polite"></p>
  <div id="commentList" class="comment-list" aria-busy="true">正在寻找星星留下的讯息…</div>
  <button type="button" id="retryComments" class="button secondary" hidden>重新加载</button>
  <button type="button" id="loadMoreComments" class="button secondary" hidden>加载更多留言</button>
  <noscript><p>开启 JavaScript 后可以查看和发表留言。</p></noscript></section></div></main>
<footer class="site-footer"><a class="footer-brand" href="/">✳ 小涵的星空手记</a><p>以一灯燃百千灯，直至万灯皆明。</p><div><a href="/rss.xml">RSS 订阅</a><span aria-hidden="true">·</span><a href="https://github.com/yuhan2680/Website" target="_blank" rel="noopener noreferrer">本站源码 ↗</a><span aria-hidden="true">·</span><a href="/friendlinks">交换友链</a></div><small>© 2026 小涵 Naiwenel</small></footer>

<button id="backToTop" type="button" class="icon-button" aria-label="返回顶部" hidden>↑</button>
</body></html>
