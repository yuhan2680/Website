<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>个人资料 · 小涵 Naiwenel</title>
  <link rel="icon" href="/assets/images/avatar-logo.jpg">
  <link rel="stylesheet" href="/assets/css/admin.css">
  <script src="/assets/js/admin-profile.js" type="module"></script>
</head>
<body>
  <header class="admin-header">
    <a href="/" class="admin-brand"><img src="/assets/images/avatar-logo.jpg" width="30" height="30" alt="">小涵 <span>内容管理</span></a>
    <nav class="admin-nav" aria-label="后台导航"><a href="/admin">文章</a><a href="/admin/friendlinks">友情链接</a><a href="/admin/profile" aria-current="page">个人资料</a><a href="/admin/projects">项目</a><a href="/admin/donations">赞助</a></nav>
    <div class="account"><span id="accountName"></span><a href="/cdn-cgi/access/logout">退出</a></div>
  </header>
  <main class="profile-editor">
    <h1>个人资料</h1>
    <form id="profileEditor" autocomplete="off">
      <fieldset id="profileFields" disabled>
        <section aria-labelledby="cardHeading">
          <header><h2 id="cardHeading">首页个人卡片</h2><a href="/" target="_blank" rel="noopener">查看首页 ↗</a></header>
          <label for="profileName">显示名称</label>
          <input id="profileName" name="name" maxlength="80" required>
          <label for="profileBio">简介</label>
          <textarea id="profileBio" name="bio" maxlength="300" rows="2"></textarea>
          <label for="profileAvatar">头像地址</label>
          <div class="profile-image-field">
            <input id="profileAvatar" name="avatar" maxlength="2048" required spellcheck="false">
            <button type="button" data-upload="avatar" aria-label="上传首页头像">上传头像</button>
          </div>
          <label for="profileTags">标签（每行一个）</label>
          <textarea id="profileTags" name="tags" rows="3"></textarea>
        </section>
        <section aria-labelledby="learningHeading">
          <header><h2 id="learningHeading">首页学习卡片</h2></header>
          <label for="learningTitle">卡片标题</label>
          <input id="learningTitle" name="learningTitle" maxlength="80" required>
          <label for="learningItems">学习内容（每行一项）</label>
          <textarea id="learningItems" name="learning" rows="3"></textarea>
        </section>
        <section aria-labelledby="aboutHeading">
          <header><h2 id="aboutHeading">关于我</h2><a href="/about" target="_blank" rel="noopener">查看关于我 ↗</a></header>
          <label for="aboutTitle">页面标题</label>
          <input id="aboutTitle" name="aboutTitle" maxlength="100" required>
          <label for="aboutAvatar">头像地址</label>
          <div class="profile-image-field">
            <input id="aboutAvatar" name="aboutAvatar" maxlength="2048" required spellcheck="false">
            <button type="button" data-upload="aboutAvatar" aria-label="上传关于我头像">上传头像</button>
          </div>
          <label for="aboutMarkdown">正文（Markdown）</label>
          <textarea id="aboutMarkdown" name="aboutMarkdown" maxlength="20000" required rows="15"></textarea>
        </section>
        <input id="avatarFile" type="file" accept=".jpg,.jpeg,.png,.svg,image/jpeg,image/png,image/svg+xml" hidden>
        <input id="aboutAvatarFile" type="file" accept=".jpg,.jpeg,.png,.svg,image/jpeg,image/png,image/svg+xml" hidden>
      </fieldset>
      <footer>
        <p id="profileStatus" role="status" aria-live="polite">正在读取资料…</p>
        <button id="reloadProfile" type="button" hidden>重新读取资料</button>
        <button id="saveProfile" type="submit" class="primary" disabled>保存资料</button>
      </footer>
    </form>
  </main>
</body>
</html>
